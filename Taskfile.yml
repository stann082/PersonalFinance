version: '3'

tasks:
  default:
    desc: Deploy both CLI and UI
    cmds:
      - task: cli
      - task: ui

  cli:
    desc: Publish and install fin.exe to %APPDATA%\utils
    cmds:
      - pwsh -NoProfile -File scripts/deploy-cli.ps1

  ui:
    desc: Publish and install the MAUI app to %LOCALAPPDATA%\PersonalFinance
    cmds:
      - pwsh -NoProfile -File scripts/deploy-ui.ps1

  run:
    desc: Run the MAUI UI app
    cmds:
      - dotnet run --project src/PersonalFinance.UI/PersonalFinance.UI.csproj -f net10.0-windows10.0.19041.0
